name: Build site from README

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      probe_all:
        description: Re-probe every entry, ignoring cached verdicts
        type: boolean
        default: false
  push:
    branches: [main]
    # No paths filter, deliberately: every push must either supersede the
    # in-flight build (concurrency cancel) or start the one that replaces it.
    # Irrelevant pushes just redeploy the same bytes.

# The build never writes to the repository. Added dates derive from git
# history, probe results live in the Actions cache, docs/ ships as a Pages
# artifact — so contents stays read-only and nothing can race a human push.
permissions:
  contents: read

# docs/ is a pure function of main's tip, so an older run can only produce
# stale output — supersede it rather than queueing it.
concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ format('github-pages-{0}', github.run_attempt) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # added-date derivation walks the README's history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Rolling probe cache: unique key so every run saves, restore-keys pulls
      # the most recent.
      #
      # A miss is NOT harmless, which is what "degraded never, slower once" used
      # to claim here. actions/cache scopes restores by a version derived from
      # this `path` list, so editing the list — adding data/tarballs.json on
      # 2026-08-18 — makes `restore-keys` match nothing and forces a cold start
      # for every probe at once. That cold start wants ~1,400 API calls, and if
      # the hourly budget happens to be spent the probes all fail together
      # (#1673). data/stars.json is committed now so a miss costs staleness
      # rather than the data itself; before changing this list again, expect a
      # full re-probe and check the quota first.
      - uses: actions/cache@v4
        with:
          path: |
            data/npm-map.json
            data/stars.json
            data/readmes.json
            data/tarballs.json
          key: probe-data-v2-${{ github.run_id }}
          restore-keys: probe-data-v2-
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The nightly run is the authoritative refresh: it re-checks every
          # entry regardless of cached verdicts, so a plugin that publishes to
          # npm can never be stuck on a stale "not published" (see #487).
          # Push-triggered runs stay incremental.
          PROBE_ALL: ${{ (github.event_name == 'schedule' || inputs.probe_all) && '1' || '' }}
        run: |
          node scripts/probe-npm.mjs
          node scripts/probe-stars.mjs
          node scripts/probe-readmes.mjs
          # Runs every time, not just nightly: a release-asset URL validated at
          # submission can 404 later without anyone touching the entry, and the
          # set is small enough that there is no reason to sample it (#1619).
          node scripts/probe-tarballs.mjs
          node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Probes may exhaust the installation's hourly REST budget. Waiting here
      # preserves a successful build and lets deployment retry without probing.
      - name: Check deployment readiness
        id: readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs'
          import { setTimeout } from 'node:timers/promises'
          const deadline = Date.now() + 65 * 60 * 1000
          for (;;) {
            const response = await fetch(`${process.env.GITHUB_API_URL}/rate_limit`, {
              headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json', 'user-agent': 'awesome-dsh-pages-deploy' },
              signal: AbortSignal.timeout(30000),
            })
            if (!response.ok) throw new Error(`Rate-limit check failed: HTTP ${response.status}`)
            const { remaining, reset } = (await response.json()).resources.core
            if (!Number.isFinite(remaining) || !Number.isFinite(reset)) throw new Error('Invalid API budget response')
            if (remaining >= 30) break
            const delay = Math.max(1000, reset * 1000 - Date.now() + 1000)
            if (Date.now() + delay > deadline) throw new Error('API budget did not recover within 65 minutes')
            console.log(`Waiting ${Math.ceil(delay / 1000)} seconds for deployment API budget`)
            await setTimeout(delay)
          }
          const site = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json', 'user-agent': 'awesome-dsh-pages-deploy' },
            signal: AbortSignal.timeout(30000),
          })
          if (!site.ok && site.status !== 404) throw new Error(`Pages configuration check failed: HTTP ${site.status}`)
          const enabled = site.ok && (await site.json()).build_type === 'workflow'
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`)
          if (!enabled) {
            const message = 'Pages deployment skipped: this repository has no Pages site configured for GitHub Actions. The built site remains available as a workflow artifact.'
            console.log(`::notice::${message}`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`)
          }
          NODE
      - id: deployment
        if: steps.readiness.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
